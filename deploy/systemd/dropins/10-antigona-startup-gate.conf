# 10-antigona-startup-gate.conf - systemd drop-in carrying the C11 startup gate.
#
# This drop-in is an INSTALLATION ARTIFACT ONLY.  It is rendered by
#   deploy/systemd/install_units.sh --dropins
# into <DEST_DIR>/<unit>.service.d/10-antigona-startup-gate.conf for every
# Antigona unit.  A drop-in is MERGED into whatever unit already exists -- it does
# not replace the unit -- so the fail-closed gate reaches an already-hardened live
# /etc/systemd/system/antigona-*.service without discarding its service sandbox or
# privilege drop.
#
# The gate is DEFAULT-CLOSED: a missing interpreter, a missing validator module or
# any non-zero validator exit aborts the unit start.  The single override is
# ANTIGONA_SKIP_STARTUP_GATE=1 (loud, journal-visible).
#
# Installing this file is an OWNER-GATED action: this installer writes the file
# under --dest only.  Running `systemctl daemon-reload` and restarting the affected
# services to activate the drop-in is NOT done by the installer and must be
# reviewed and performed by the owner.

[Service]
ExecStartPre=@ANTIGONA_ROOT@/scripts/startup_gate.sh
