; Alembic configuration for the Antigona async durable layer (P4.3).
; ``script_location`` and ``sqlalchemy.url`` are overridden programmatically by
; antigona.storage.migrator.alembic_config(); the values below are the defaults
; used when the ``alembic`` CLI is invoked directly from this directory.
;
; No [loggers]/[handlers] sections on purpose: env.py must not reconfigure the
; process-wide logging that antigona.observability relies on.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os
sqlalchemy.url = sqlite+aiosqlite:///%(here)s/../../../antigona.db

[post_write_hooks]
